# 不再需要 version 字段

services:
  db:
    image: mysql:8.0
    container_name: travel-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: travel
    ports:
      - "3308:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql # 使用具名卷持久化数据
      - ./certs:/app/certs # 挂载证书目录
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379" # 可选：映射到宿主机方便调试
    volumes:
      - redis_data_dev:/data # 持久化 Redis 数据
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-server-dev
    restart: unless-stopped
    ports:
      - "9000:8080"
    env_file:
      - .env.dev
    environment:
      - GOPROXY=https://goproxy.cn,direct
    volumes:
      - .:/app
      - /app/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

# 顶级 volumes 必须顶格声明，且与 services 对齐
volumes:
  mysql_data_dev:
  redis_data_dev:
