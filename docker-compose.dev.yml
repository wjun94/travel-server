version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: travel-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: travel
    ports:
      - "3307:3306" # 将数据库端口映射到宿主机，方便本地工具连接
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./certs:/app/certs # 将宿主机的 certs 目录挂载到容器内 /app/certs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel-redis-dev
    restart: unless-stopped
    # 可选：映射端口供宿主机调试（如不需要可删除）
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: travel-server-dev
    restart: unless-stopped
    ports:
      - "8082:8080" # HTTP 服务端口
      - "2346:2345" # Delve 调试端口（如果使用 dlv 而非 air）
    env_file:
      # 环境变量 config读取
      - .env.dev
    volumes:
      # 挂载当前目录到容器内，实现代码热更新
      - .:/app
      # 避免挂载覆盖容器内的依赖目录（可选）
      - /app/tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data_dev:
