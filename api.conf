server {
    listen 80;
    server_name cnicu.top www.cnicu.top localhost;
    return 301 https://$host$request_uri;
}

# 主站 cnicu.top（经七牛 CDN 回源），使用 cnicu.top 证书
server {
    listen 443 ssl http2;
    server_name cnicu.top localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    charset utf-8;
    client_max_body_size 20m;

    include /etc/nginx/includes/locations.conf;
}

# www.cnicu.top 直连源站，使用独立证书
server {
    listen 443 ssl http2;
    server_name www.cnicu.top;

    ssl_certificate     /etc/nginx/ssl/www/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    charset utf-8;
    client_max_body_size 20m;

    include /etc/nginx/includes/locations.conf;
}
